<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --purple-900:#241B33;
      --purple-700:#3D2766;
      --purple-600:#5A3A8C;
      --purple-200:#D9CCEF;
      --purple-050:#F7F3FC;
      --gold-600:#B8862F;
      --gold-500:#D4A73E;
      --ink:#2A2433;
      --ink-soft:#5C5468;
      --line:#E4DCEF;
      --white:#FFFFFF;
      --radius:14px;
      --shadow-sm:0 1px 3px rgba(42,36,51,.08);
      --shadow-md:0 6px 20px rgba(61,39,102,.12);
    }
    *{box-sizing:border-box}
    html{font-size:16px}
    body{font-family:'Inter',sans-serif;background:var(--purple-050);color:var(--ink);line-height:1.55;margin:0;padding:0}
    header.report{
      background:linear-gradient(135deg,var(--purple-900) 0%,var(--purple-700) 62%,#4A2F7A 100%);
      color:#fff;padding:28px clamp(20px,4vw,56px) 34px;position:relative;overflow:hidden;
    }
    header.report::after{
      content:"";position:absolute;top:-120px;right:-120px;width:420px;height:420px;
      background:radial-gradient(circle,rgba(232,185,62,.16),transparent 65%);
      pointer-events:none;
    }
    header.report h1{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(1.5rem,3.2vw,2.35rem);margin:0 0 8px}
    header.report .meta{font-family:'Inter',sans-serif;font-size:0.9rem;opacity:.9;margin-bottom:16px}
    header.report .resumen{font-family:'Inter',sans-serif;font-weight:400;font-size:1rem;line-height:1.6;opacity:.95}
    .section-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--purple-200)}
    .section-head .icon{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
    .section-head .icon.secc1{background:var(--purple-600)}
    .section-head .icon.secc2{background:var(--gold-500)}
    .section-head h2{font-family:'Sora',sans-serif;font-weight:700;font-size:1.35rem;margin:0}
    .cards{display:grid;grid-template-columns:1fr;gap:20px;padding:clamp(20px,4vw,56px)}
    .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:9px;transition:transform .2s,box-shadow .2s}
    .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .card h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1.1rem;margin:0 0 4px}
    .card .campo{font-family:'Inter',sans-serif;font-size:0.95rem;line-height:1.55}
    .card .campo strong{color:var(--ink);font-weight:600}
    .hipotesis{background:var(--purple-050);border-left:3px solid var(--purple-600);padding:12px;border-radius:6px;margin-top:4px}
    .hipotesis strong{color:var(--purple-700)}
    .chart-wrap{width:100%;max-width:100%;overflow-x:auto}
    .chart-wrap canvas{max-width:100%}
    .decision{background:var(--white);border-left:3px solid var(--gold-500);border-radius:var(--radius);padding:18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .decision h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;margin:0 0 8px;color:var(--ink)}
    .decision p{font-family:'Inter',sans-serif;font-size:0.95rem;line-height:1.55;margin:0;color:var(--ink-soft)}
    footer.report{background:var(--purple-900);color:#C9BCE0;padding:24px clamp(20px,4vw,56px)}
    footer.report .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
    footer.report h4{font-family:'Sora',sans-serif;font-weight:700;font-size:0.9rem;margin:0 0 8px;color:var(--gold-500)}
    footer.report ul{margin:0;padding-left:18px;font-size:0.85rem;line-height:1.6;color:#C9BCE0}
    footer.report li{margin-bottom:4px}
    @media (prefers-reduced-motion: reduce){.card{transition:none}}
    .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <header class="report">
    <h1>{{TITULO}}</h1>
    <div class="meta">Generado: {{FECHA}} | Pregunta: {{PREGUNTA}}</div>
    <div class="resumen">{{RESUMEN_EJECUTIVO}}</div>
  </header>

  <main>
    <section aria-labelledby="sec-senales">
      <div class="section-head">
        <div class="icon secc1" aria-hidden="true">◆</div>
        <h2 id="sec-senales">Señales Débiles</h2>
      </div>
      <div class="cards" id="senales-container">
{{SENALES_HTML}}
      </div>
    </section>

    <section aria-labelledby="sec-decisiones">
      <div class="section-head">
        <div class="icon secc2" aria-hidden="true">▲</div>
        <h2 id="sec-decisiones">Decisiones Estratégicas</h2>
      </div>
      <div class="cards" id="decisiones-container">
{{DECISIONES_HTML}}
      </div>
    </section>
  </main>

  <footer class="report">
    <div class="grid">
      <div>
        <h4>Limitaciones</h4>
        <ul>
{{LIMITACIONES_HTML}}
        </ul>
      </div>
      <div>
        <h4>Fuentes</h4>
        <ul>
{{FUENTES_HTML}}
        </ul>
      </div>
      <div>
        <h4>Metodología</h4>
        <ul>
{{METODOLOGIA_HTML}}
        </ul>
      </div>
    </div>
  </footer>

  <script>
    // Render Chart.js gráficas embebidas
    (function(){
      const graficas = window.REPORT_GRAFICAS || {};
      Object.entries(graficas).forEach(([id, config])=>{
        const canvas = document.getElementById(id);
        if(canvas && canvas.getContext){
          new Chart(canvas.getContext('2d'), config);
        }
      });
    })();
  </script>
</body>
</html>
